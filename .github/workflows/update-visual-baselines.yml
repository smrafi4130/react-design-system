name: Update visual baselines
on: workflow_dispatch
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm build-storybook
      - run: pnpm --filter @smrafi/ui exec playwright test --trace off --update-snapshots
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/visual/__screenshots__
          git diff --staged --quiet || (git commit -m "test(visual): update baselines" && git push)
